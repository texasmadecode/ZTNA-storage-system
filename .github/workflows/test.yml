name: Security System Automation and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Build the Docker Image
      run: docker build -t cyber-gatekeeper .

    - name: Run Gatekeeper Simulation Test
      run: docker run --rm cyber-gatekeeper

  # Brand new secondary release job layer
  publish-image:
    needs: build-and-test # Only run this if our core math/security tests pass successfully!
    runs-on: ubuntu-latest
    
    # Grant permission blocks to let the cloud agent write packages to your account
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 1. Safely log into the GitHub Container Registry using native actor macros
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

        # 2. Automatically build the production asset and push it to your package repository
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/texasmadecode/ztna-storage-system:latest

